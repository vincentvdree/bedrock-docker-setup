; Xdebug is loaded by docker-php-ext-xdebug.ini (generated in the image).
; Declaring zend_extension again here triggers
; "Cannot load Xdebug - it was already loaded" on every PHP invocation.
;
; This file is the single source of truth for Xdebug settings, except for the
; mode: the image ships xdebug.mode=off and development opts in through
; XDEBUG_MODE (compose.override.yaml, overridable from .env). The environment
; variable wins over an ini setting, so mode is deliberately not set here.

xdebug.start_with_request=yes

; The IDE listens on the host; the container reaches it through the
; host.docker.internal alias mapped in compose.override.yaml.
xdebug.client_host=host.docker.internal
xdebug.client_port=9003

; PhpStorm's default session key. Combined with PHP_IDE_CONFIG=serverName=...
; it lets PhpStorm resolve the "bedrock-docker-setup" server — and therefore the
; /app -> project-root path mapping — for web requests and for CLI runs
; (WP-CLI, PHPUnit) alike.
xdebug.idekey=PHPSTORM

; Don't stall the request for a full second when no IDE is listening.
xdebug.connect_timeout_ms=200

; WordPress nests deeply: the plugin/filter chain plus a debugger stepping
; through it passes Xdebug's default 256 and aborts the request with
; "Maximum function nesting level reached".
xdebug.max_nesting_level=512

; PhpStorm requests variables on demand, so the stingy defaults (32 children,
; depth 3, 512 bytes) only truncate what you can inspect. Structures like
; $wp_filter or a full $post need considerably more.
xdebug.var_display_max_children=256
xdebug.var_display_max_depth=8
xdebug.var_display_max_data=4096

; Debugging the debugger: uncomment both lines, `docker compose restart php`,
; then read the log with `make xdebug-log`. Level 7 is very chatty.
; xdebug.log=/tmp/xdebug.log
; xdebug.log_level=7
xdebug.log_level=0
