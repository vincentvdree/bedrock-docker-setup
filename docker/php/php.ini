; General
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
default_socket_timeout = 300

; Uploads
upload_max_filesize = 128M
post_max_size = 128M

; Errors
display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ERROR | E_WARNING | E_PARSE | E_STRICT

; Timezone
date.timezone = UTC

; OPcache
opcache.enable = 1
; Off by default in CLI. WP-CLI is the only PHP CLI entry point here, and its
; Site Health check reports the cache as disabled without this. Safe to enable
; because validate_timestamps below re-checks mtimes on every request.
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Realpath cache
realpath_cache_size = 4096K
realpath_cache_ttl = 600
